name: Build and Push Docker Images

on:
  # Run weekly on Mondays at midnight UTC
  schedule:
    - cron: '0 0 * * 1'
  # Allow manual trigger
  workflow_dispatch:
  # Build on push to main
  push:
    branches:
      - main
    paths:
      - 'redis-sentinel/**'
      - 'haproxy/**'
      - 'common/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-and-push.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  REDIS_DISTRO: "bookworm"
  HAPROXY_VERSION: "3.2"
  # No suffix - publish to regular tags
  BETA_SUFFIX: ''

jobs:
  # Detect which components changed to avoid unnecessary builds
  changes:
    runs-on: ubuntu-latest
    outputs:
      redis-sentinel: ${{ steps.filter.outputs.redis-sentinel }}
      haproxy: ${{ steps.filter.outputs.haproxy }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            redis-sentinel:
              - 'redis-sentinel/**'
              - 'common/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/build-and-push.yml'
            haproxy:
              - 'haproxy/**'
              - 'common/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/build-and-push.yml'

  # Build Rust binary for redis-sentinel (AMD64 - bookworm, native, fast ~2-3min)
  # The binary is version-agnostic — one build covers all Redis major versions.
  build-rust-binaries-redis-sentinel-amd64:
    needs: changes
    if: ${{ needs.changes.outputs['redis-sentinel'] == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build and push rust binaries for redis-sentinel amd64
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./redis-sentinel/Dockerfile
          target: rust-builder-local-output
          platforms: linux/amd64
          push: true
          # SHA-tagged, not :latest — this is a same-run handoff to
          # build-redis-sentinel-amd64, never pulled independently.
          tags: ${{ env.IMAGE_PREFIX }}/redis-sentinel-rust-binaries:${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=redis-sentinel-rust-binaries
          cache-to: type=gha,mode=max,scope=redis-sentinel-rust-binaries

  # Build Rust binary for haproxy (AMD64 - alpine, native, fast ~2-3min)
  build-rust-binaries-haproxy-amd64:
    needs: changes
    if: ${{ needs.changes.outputs.haproxy == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build and push rust binaries for haproxy amd64
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./haproxy/Dockerfile
          target: rust-builder-local-output
          platforms: linux/amd64
          push: true
          # SHA-tagged, not :latest — this is a same-run handoff to
          # build-haproxy-amd64, never pulled independently.
          tags: ${{ env.IMAGE_PREFIX }}/haproxy-rust-binaries:${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=haproxy-rust-binaries
          cache-to: type=gha,mode=max,scope=haproxy-rust-binaries

  # Build redis-sentinel for AMD64 (one image per Redis major version)
  build-redis-sentinel-amd64:
    needs: [changes, build-rust-binaries-redis-sentinel-amd64]
    if: ${{ needs.changes.outputs['redis-sentinel'] == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        redis_major: [7, 8]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build and push redis-sentinel for amd64
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./redis-sentinel/Dockerfile
          build-args: REDIS_VERSION=${{ matrix.redis_major }}
          build-contexts: |
            rust-binaries=docker-image://${{ env.IMAGE_PREFIX }}/redis-sentinel-rust-binaries:${{ steps.sha.outputs.short }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/redis-sentinel:${{ matrix.redis_major }}${{ env.BETA_SUFFIX }}
            ${{ env.IMAGE_PREFIX }}/redis-sentinel:${{ matrix.redis_major }}-${{ env.REDIS_DISTRO }}${{ env.BETA_SUFFIX }}
            ${{ env.IMAGE_PREFIX }}/redis-sentinel:${{ matrix.redis_major }}-${{ steps.sha.outputs.short }}${{ env.BETA_SUFFIX }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/redis-sentinel:${{ matrix.redis_major }}
          cache-to: type=inline

      # The floating :<major> tags track redis:<major>-bookworm at BUILD time,
      # so the bundled minor advances silently with each weekly rebuild. These
      # :<major.minor> aliases are compatibility markers, not builds of their
      # own: an alias existing proves every :<major> build published since is
      # at least that minor. RDB streams are not backward-readable across
      # minors (7.0=RDB10, 7.2=11, 7.4=12), so the platform's HA conversion
      # pins the adopted service's own minor alias — a source newer than any
      # published build fails at image pull, loudly and before any data is
      # touched. Aliases freeze in place when upstream moves to the next
      # minor; that is deliberate (freshness comes from the floating tags,
      # never from rebuilding an old minor).
      - name: Publish bundled-minor alias tags
        run: |
          img="${{ env.IMAGE_PREFIX }}/redis-sentinel:${{ matrix.redis_major }}-${{ steps.sha.outputs.short }}${{ env.BETA_SUFFIX }}"
          version=$(docker run --rm --entrypoint redis-server "$img" --version)
          echo "bundled: $version"
          minor=$(echo "$version" | sed -nE 's/.*v=([0-9]+\.[0-9]+).*/\1/p')
          if [ -z "$minor" ]; then
            echo "could not parse a major.minor out of redis-server --version" >&2
            exit 1
          fi
          # A mis-matched alias would poison the compatibility proof — refuse
          # to publish rather than tag a :7.x alias onto an :8 build.
          case "$minor" in
            "${{ matrix.redis_major }}".*) ;;
            *)
              echo "bundled minor $minor does not belong to major ${{ matrix.redis_major }}" >&2
              exit 1
              ;;
          esac
          docker buildx imagetools create \
            -t "${{ env.IMAGE_PREFIX }}/redis-sentinel:${minor}${{ env.BETA_SUFFIX }}" \
            -t "${{ env.IMAGE_PREFIX }}/redis-sentinel:${minor}-${{ env.REDIS_DISTRO }}${{ env.BETA_SUFFIX }}" \
            "$img"

  # Build haproxy image for AMD64
  build-haproxy-amd64:
    needs: [changes, build-rust-binaries-haproxy-amd64]
    if: ${{ needs.changes.outputs.haproxy == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short SHA and version parts
        id: meta
        run: |
          echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "major=$(echo ${{ env.HAPROXY_VERSION }} | cut -d. -f1)" >> $GITHUB_OUTPUT

      - name: Build and push haproxy for amd64
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./haproxy/Dockerfile
          build-args: HAPROXY_VERSION=${{ env.HAPROXY_VERSION }}
          build-contexts: |
            rust-binaries=docker-image://${{ env.IMAGE_PREFIX }}/haproxy-rust-binaries:${{ steps.meta.outputs.short }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/haproxy:${{ env.HAPROXY_VERSION }}-alpine${{ env.BETA_SUFFIX }}
            ${{ env.IMAGE_PREFIX }}/haproxy:${{ env.HAPROXY_VERSION }}${{ env.BETA_SUFFIX }}
            ${{ env.IMAGE_PREFIX }}/haproxy:${{ steps.meta.outputs.major }}${{ env.BETA_SUFFIX }}
            ${{ env.IMAGE_PREFIX }}/haproxy:${{ env.HAPROXY_VERSION }}-${{ steps.meta.outputs.short }}${{ env.BETA_SUFFIX }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/haproxy:${{ env.HAPROXY_VERSION }}
          cache-to: type=inline
