name: Build and Push Docker Images

on:
  # Run daily at midnight UTC. Daily (not weekly) keeps the window between an
  # upstream minor release and our first per-minor build short: HA conversion
  # pins the source's own minor, so a brand-new upstream minor is convertible
  # only once discover-redis-minors has seen it and this workflow has
  # published its image.
  schedule:
    - cron: '0 0 * * *'
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass the content gate and rebuild+push everything"
        type: boolean
        default: false
  # Build on push to main
  push:
    branches:
      - main
    paths:
      - 'redis-sentinel/**'
      - 'haproxy/**'
      - 'common/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-and-push.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  HAPROXY_VERSION: "3.2"
  # The single policy knob for which Redis majors get per-minor builds —
  # mirrors the template's supportedImageMajorVersions. The `X.Y` minors
  # within each major are discovered from Docker Hub on every run, never
  # hardcoded here.
  REDIS_SUPPORTED_MAJORS: "7 8"
  # No suffix - publish to regular tags
  BETA_SUFFIX: ''

jobs:
  # Detect which components changed to avoid unnecessary builds
  changes:
    runs-on: ubuntu-latest
    outputs:
      redis-sentinel: ${{ steps.filter.outputs.redis-sentinel }}
      haproxy: ${{ steps.filter.outputs.haproxy }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            redis-sentinel:
              - 'redis-sentinel/**'
              - 'common/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/build-and-push.yml'
            haproxy:
              - 'haproxy/**'
              - 'common/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/build-and-push.yml'

  # Enumerate every `X.Y` minor Docker Hub publishes a bare `redis:X.Y`
  # tag for (the exact tag the wrapper builds FROM) within the supported
  # majors. The bare minor tag — not a Debian-codename variant — is the
  # discovery key AND the build base: upstream rebases new minors onto new
  # Debian releases (8.6+ ship `-trixie` only, no `-bookworm`), and pinning
  # a codename silently stopped discovery at 8.4 while the platform's HA
  # conversion kept pinning newer sources' minors — every such conversion
  # died on an unpublished tag. The bare tag always exists for a released
  # minor and always points at upstream's current Debian variant, so the
  # codename can never strand discovery again.
  #
  # The list is discovered per run instead of hardcoded so a new upstream
  # minor starts building the day Docker Hub carries it — the platform's HA
  # conversion pins the adopted service's own `major.minor` minor, so a
  # minor with no published image is a minor whose users cannot convert.
  # Old minors stay in the set for the same reason: building a minor a user
  # already runs is strictly better than stranding their conversion.
  #
  # The job also marks the newest minor of each major so the floating
  # :<major> tags keep riding it, exactly as the hardcoded matrix's
  # `floating_major` entries did.
  discover-redis-minors:
    needs: changes
    if: ${{ needs.changes.outputs['redis-sentinel'] == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      packages: read
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}

    steps:
      - name: Discover Redis minor tags on Docker Hub
        id: discover
        run: |
          # Use the Docker Registry v2 API (registry-1.docker.io, anonymous
          # pull token) rather than the Hub website API (hub.docker.com):
          # the website API hard-blocks shared GitHub runner IPs with
          # persistent 403s, while the registry endpoint is the same path
          # every `docker pull` takes and is expected to serve CI runners.
          # --retry-all-errors: plain --retry does not retry 403/429.
          token=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
            "https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/redis:pull" \
            | jq -r .token)
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "could not obtain an anonymous pull token" >&2
            exit 1
          fi

          url="https://registry-1.docker.io/v2/library/redis/tags/list?n=1000"
          : > /tmp/hub-tags.txt
          pages=0
          while [ -n "$url" ]; do
            if [ "$pages" -ge 50 ]; then
              echo "more than 50 pages of registry tags; refusing to loop forever" >&2
              exit 1
            fi
            resp=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
              -H "Authorization: Bearer $token" -D /tmp/tag-headers.txt "$url")
            echo "$resp" | jq -r '.tags[]' >> /tmp/hub-tags.txt
            # RFC-5988 pagination: a Link rel="next" header carries the
            # relative URL of the next page; no header means last page.
            next=$(sed -nE 's/^[Ll]ink: *<([^>]+)>; *rel="next".*/\1/p' /tmp/tag-headers.txt | tr -d '\r')
            if [ -n "$next" ]; then
              url="https://registry-1.docker.io${next}"
            else
              url=""
            fi
            pages=$((pages + 1))
          done

          # Emit a matrix-include array: every minor gets a plain entry, the
          # newest minor of each major additionally carries floating_major so
          # the :<major> tag minting below keeps working unchanged. Values
          # come from a digits-and-dots regex, so hand-building the JSON is
          # safe.
          : > /tmp/minors.txt
          matrix="["
          sep=""
          for major in $REDIS_SUPPORTED_MAJORS; do
            found=$(grep -E "^${major}\.[0-9]+$" /tmp/hub-tags.txt | sort -uV)
            if [ -z "$found" ]; then
              # Anti-shrink: an empty result for a supported major means the
              # discovery is broken (API change, filter regression), not that
              # the major vanished upstream — fail loudly rather than
              # silently stop building its minors.
              echo "no X.Y minors discovered for supported major ${major}" >&2
              exit 1
            fi
            echo "$found" >> /tmp/minors.txt
            newest=$(echo "$found" | tail -n 1)
            for minor in $found; do
              if [ "$minor" = "$newest" ]; then
                entry="{\"redis_version\":\"${minor}\",\"floating_major\":\"${major}\"}"
              else
                entry="{\"redis_version\":\"${minor}\"}"
              fi
              matrix="${matrix}${sep}${entry}"
              sep=","
            done
          done
          matrix="${matrix}]"

          echo "discovered minors:"
          cat /tmp/minors.txt
          echo "matrix: $matrix"

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      # A published :X.Y tag is a build line users are pinned to. If the
      # discovered set ever fails to cover one (Docker Hub API glitch, filter
      # regression), that minor would silently stop receiving builds — fail
      # the run instead. Best-effort on the listing side only: a ghcr API
      # hiccup warns and proceeds so it cannot block image builds. Published
      # minors outside REDIS_SUPPORTED_MAJORS are exempt, so retiring a major
      # stays a one-knob policy change.
      - name: Refuse to shrink the published minor set (best-effort)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          endpoint="/orgs/${{ github.repository_owner }}/packages/container/redis-ha%2Fredis-sentinel/versions?per_page=100"
          if published=$(gh api --paginate "$endpoint" --jq '.[].metadata.container.tags[]' 2>/dev/null); then
            majors_re=$(echo "$REDIS_SUPPORTED_MAJORS" | tr ' ' '|')
            published_minors=$(echo "$published" | grep -E "^(${majors_re})\.[0-9]+$" | sort -uV || true)
            missing=""
            for tag in $published_minors; do
              grep -qx "$tag" /tmp/minors.txt || missing="$missing $tag"
            done
            if [ -n "$missing" ]; then
              echo "discovered set does not cover already-published minors:$missing" >&2
              exit 1
            fi
            echo "coverage ok: all published minors are in the discovered set"
          else
            echo "warning: could not list published ghcr tags; skipping coverage guard"
          fi

      # The guard above compares discovery against what we ALREADY publish, so
      # it can only catch the set shrinking. It cannot catch the set failing to
      # GROW — and that is the failure that actually happened: the discovery
      # regex pinned a Debian codename (`X.Y-bookworm`), upstream rebased new
      # minors onto trixie, and 8.6/8.8/8.10 were simply never seen. Nothing
      # shrank, so the run stayed green for 12.6 days while every HA conversion
      # of a current-version Redis died on an unpullable tag (station thread
      # default-ha-redis-template-doesn-t-deploy-8baf2a01).
      #
      # This is the positive check that closes it, and it does not trust our own
      # regex: upstream's floating `redis:<major>` tag IS the newest minor of
      # that major, by definition and by the same path `docker pull` takes. If
      # no discovered minor resolves to the same manifest digest, discovery has
      # missed upstream's current minor — whatever the reason.
      #
      # Fails on a real miss; warns and proceeds if the digest lookup itself
      # could not be performed, so a registry hiccup never blocks image builds.
      - name: Refuse to miss upstream's current minor
        run: |
          accept='application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'

          token=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
            "https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/redis:pull" \
            | jq -r .token) || token=""
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "warning: could not obtain an anonymous pull token; skipping current-minor guard"
            exit 0
          fi

          digest_of() {
            curl -fsSL --retry 3 --retry-all-errors --retry-delay 3 -I \
              -H "Authorization: Bearer $token" -H "Accept: ${accept}" \
              "https://registry-1.docker.io/v2/library/redis/manifests/$1" 2>/dev/null \
              | sed -nE 's/^[Dd]ocker-[Cc]ontent-[Dd]igest: *(.*)/\1/p' | tr -d '\r'
          }

          for major in $REDIS_SUPPORTED_MAJORS; do
            want=$(digest_of "$major")
            if [ -z "$want" ]; then
              echo "warning: could not resolve redis:${major}; skipping guard for this major"
              continue
            fi

            # Newest-first: a healthy run matches on the first probe.
            matched=""
            for minor in $(grep -E "^${major}\.[0-9]+$" /tmp/minors.txt | sort -urV); do
              if [ "$(digest_of "$minor")" = "$want" ]; then
                matched="$minor"
                break
              fi
            done

            if [ -z "$matched" ]; then
              echo "redis:${major} (${want}) matches no discovered ${major}.x minor." >&2
              echo "Discovered for ${major}:" >&2
              grep -E "^${major}\.[0-9]+$" /tmp/minors.txt | sort -uV | sed 's/^/  /' >&2
              echo "Discovery is missing upstream's current ${major}.x minor, so HA" >&2
              echo "conversion will pin a redis-sentinel tag that was never built." >&2
              exit 1
            fi
            echo "current-minor ok: redis:${major} == ${matched}"
          done

  # Build Rust binary for redis-sentinel (AMD64 - bookworm, native, fast ~2-3min)
  # The binary is version-agnostic — one build covers all Redis major versions.
  build-rust-binaries-redis-sentinel-amd64:
    needs: changes
    if: ${{ needs.changes.outputs['redis-sentinel'] == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build and push rust binaries for redis-sentinel amd64
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./redis-sentinel/Dockerfile
          target: rust-builder-local-output
          platforms: linux/amd64
          push: true
          # SHA-tagged, not :latest — this is a same-run handoff to
          # build-redis-sentinel-amd64, never pulled independently.
          tags: ${{ env.IMAGE_PREFIX }}/redis-sentinel-rust-binaries:${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=redis-sentinel-rust-binaries
          cache-to: type=gha,mode=max,scope=redis-sentinel-rust-binaries

  # Build Rust binary for haproxy (AMD64 - alpine, native, fast ~2-3min)
  build-rust-binaries-haproxy-amd64:
    needs: changes
    if: ${{ needs.changes.outputs.haproxy == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build and push rust binaries for haproxy amd64
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./haproxy/Dockerfile
          target: rust-builder-local-output
          platforms: linux/amd64
          push: true
          # SHA-tagged, not :latest — this is a same-run handoff to
          # build-haproxy-amd64, never pulled independently.
          tags: ${{ env.IMAGE_PREFIX }}/haproxy-rust-binaries:${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=haproxy-rust-binaries
          cache-to: type=gha,mode=max,scope=haproxy-rust-binaries

  # Build redis-sentinel for AMD64 — one continuously rebuilt image per Redis
  # MINOR, not per major. RDB streams are not backward-readable across minors
  # (7.0=RDB10, 7.2=11, 7.4=12), so the platform's HA conversion pins a
  # converted service to its own `major.minor` tag; every one of those tags
  # must therefore be a real build line that keeps receiving upstream patch,
  # base-image and wrapper (Sentinel/health-server) updates for as long as
  # this workflow runs. The frozen-alias scheme this replaces left any
  # cluster pinned to a non-current minor without security updates of any
  # kind — see the deleted mint-minor-alias.yml for the old semantics.
  #
  # The minor list comes from discover-redis-minors, never from a hand-kept
  # matrix: REDIS_SUPPORTED_MAJORS (env, above) is the single policy knob.
  # The floating :<major> tag rides the newest minor of its major (the
  # `floating_major` entries the discover job marks). There is NO mono-side
  # registry pre-flight (rejected as fail-open cost per conversion): the
  # platform pins the source's minor unconditionally and the deploy dies on
  # an unpublished tag, so this workflow's continuous coverage of every
  # released minor IS the guarantee that conversions succeed.
  build-redis-sentinel-amd64:
    needs: [changes, build-rust-binaries-redis-sentinel-amd64, discover-redis-minors]
    if: ${{ needs.changes.outputs['redis-sentinel'] == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      # Each minor is an independent build line — one broken minor must not
      # cancel the others' builds.
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover-redis-minors.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      # Skip the build entirely — same digest, no fleet redeploys — unless
      # something REAL moved: the repo code that reaches the image, the
      # upstream base image, or Debian's pending-security-fix set for that
      # base (a superseded minor's base never re-mints upstream, so apt
      # fixes are the only way OS updates reach it). The key is planted on
      # the published image as a label; digest-tracking consumers
      # (autoUpdates tagMode "sha") therefore only see a new digest when
      # there is something worth redeploying for. Fails OPEN to building —
      # a gate error must never silently freeze a tag.
      - name: Content gate
        id: gate
        run: |
          set -o pipefail
          IMG="${{ env.IMAGE_PREFIX }}/redis-sentinel"
          TAG="${{ matrix.redis_version }}${{ env.BETA_SUFFIX }}"
          BASE="redis:${{ matrix.redis_version }}"

          GATE_OK=true
          CODE_KEY=$(git rev-parse HEAD:redis-sentinel HEAD:common HEAD:Cargo.toml HEAD:Cargo.lock | sha256sum | cut -c1-16) || GATE_OK=false
          BASE_DIGEST=$(docker buildx imagetools inspect "$BASE" --format '{{json .Manifest.Digest}}' | tr -d '"') || GATE_OK=false
          docker pull -q "$BASE" >/dev/null || GATE_OK=false
          PKG_KEY=$(docker run --rm "$BASE" bash -c "apt-get update -qq >/dev/null 2>&1; apt list --upgradable 2>/dev/null | sort" | sha256sum | cut -c1-16) || GATE_OK=false

          if [ "$GATE_OK" != "true" ] || [ -z "$CODE_KEY" ] || [ -z "$BASE_DIGEST" ] || [ -z "$PKG_KEY" ]; then
            echo "::warning::content gate failed for ${TAG}; building unconditionally"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "key=gate-error-${{ github.sha }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          KEY=$(printf '%s\n' "$CODE_KEY" "$BASE_DIGEST" "$PKG_KEY" | sha256sum | cut -c1-32)
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

          PUBLISHED_KEY=$(docker buildx imagetools inspect "$IMG:$TAG" --format '{{json .Image}}' 2>/dev/null \
            | jq -r '(.config // .["linux/amd64"].config) | .Labels["railway.content-key"] // empty' 2>/dev/null || true)

          if [ "${{ github.event.inputs.force || 'false' }}" = "true" ]; then
            echo "force requested — building"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ "$KEY" = "$PUBLISHED_KEY" ]; then
            echo "unchanged (key $KEY) — skipping build; digest stays put"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed (key $KEY, published ${PUBLISHED_KEY:-<none>}) — building"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Push only the immutable sha tag here; the resolvable tags (:X.Y and,
      # for the newest minor, :X) are minted below AFTER the bundled-version
      # guard, so a base-image mixup can never reach a tag the platform pins.
      - name: Build and push redis-sentinel for amd64
        if: steps.gate.outputs.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./redis-sentinel/Dockerfile
          build-args: |
            REDIS_VERSION=${{ matrix.redis_version }}
            PKG_REFRESH=${{ steps.gate.outputs.key }}
          labels: |
            railway.content-key=${{ steps.gate.outputs.key }}
          build-contexts: |
            rust-binaries=docker-image://${{ env.IMAGE_PREFIX }}/redis-sentinel-rust-binaries:${{ steps.sha.outputs.short }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/redis-sentinel:${{ matrix.redis_version }}-${{ steps.sha.outputs.short }}${{ env.BETA_SUFFIX }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/redis-sentinel:${{ matrix.redis_version }}${{ env.BETA_SUFFIX }}
          cache-to: type=inline

      # Unchanged image: keep the per-commit pin tag and the floating major
      # pointer current WITHOUT minting a new digest — imagetools create only
      # adds tag references to the existing manifest. The digest already
      # passed the bundled-version guard when it was first published.
      - name: Refresh pin tags on unchanged image
        if: steps.gate.outputs.changed == 'false'
        run: |
          IMG="${{ env.IMAGE_PREFIX }}/redis-sentinel"
          SRC="$IMG:${{ matrix.redis_version }}${{ env.BETA_SUFFIX }}"
          tags="-t $IMG:${{ matrix.redis_version }}-${{ steps.sha.outputs.short }}${{ env.BETA_SUFFIX }}"
          if [ -n "${{ matrix.floating_major }}" ]; then
            tags="$tags -t $IMG:${{ matrix.floating_major }}${{ env.BETA_SUFFIX }}"
            tags="$tags -t $IMG:${{ matrix.floating_major }}-${{ steps.sha.outputs.short }}${{ env.BETA_SUFFIX }}"
          fi
          docker buildx imagetools create $tags "$SRC"

      # The tag IS the compatibility contract (the conversion pin trusts that
      # :8.2 bundles a Redis 8.2.x), so refuse to publish a build whose base
      # image bundles anything else rather than poison the tag.
      - name: Verify the bundled minor matches the matrix entry, then publish
        if: steps.gate.outputs.changed == 'true'
        run: |
          img="${{ env.IMAGE_PREFIX }}/redis-sentinel:${{ matrix.redis_version }}-${{ steps.sha.outputs.short }}${{ env.BETA_SUFFIX }}"
          version=$(docker run --rm --entrypoint redis-server "$img" --version)
          echo "bundled: $version"
          minor=$(echo "$version" | sed -nE 's/.*v=([0-9]+\.[0-9]+).*/\1/p')
          if [ -z "$minor" ]; then
            echo "could not parse a major.minor out of redis-server --version" >&2
            exit 1
          fi
          if [ "$minor" != "${{ matrix.redis_version }}" ]; then
            echo "bundled minor $minor does not match matrix entry ${{ matrix.redis_version }}" >&2
            exit 1
          fi

          tags="-t ${{ env.IMAGE_PREFIX }}/redis-sentinel:${{ matrix.redis_version }}${{ env.BETA_SUFFIX }}"
          if [ -n "${{ matrix.floating_major }}" ]; then
            tags="$tags -t ${{ env.IMAGE_PREFIX }}/redis-sentinel:${{ matrix.floating_major }}${{ env.BETA_SUFFIX }}"
            tags="$tags -t ${{ env.IMAGE_PREFIX }}/redis-sentinel:${{ matrix.floating_major }}-${{ steps.sha.outputs.short }}${{ env.BETA_SUFFIX }}"
          fi
          docker buildx imagetools create $tags "$img"

  # Build haproxy image for AMD64
  build-haproxy-amd64:
    needs: [changes, build-rust-binaries-haproxy-amd64]
    if: ${{ needs.changes.outputs.haproxy == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short SHA and version parts
        id: meta
        run: |
          echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "major=$(echo ${{ env.HAPROXY_VERSION }} | cut -d. -f1)" >> $GITHUB_OUTPUT

      # Same content gate as redis-sentinel (see that job for rationale);
      # package dimension via apk. The fleet's edge nodes run autoUpdates
      # tagMode "sha" — a spuriously re-minted digest here rolls every
      # HAProxy in every cluster for nothing.
      - name: Content gate
        id: gate
        run: |
          set -o pipefail
          IMG="${{ env.IMAGE_PREFIX }}/haproxy"
          TAG="${{ env.HAPROXY_VERSION }}${{ env.BETA_SUFFIX }}"
          BASE="haproxy:${{ env.HAPROXY_VERSION }}-alpine"

          GATE_OK=true
          CODE_KEY=$(git rev-parse HEAD:haproxy HEAD:common HEAD:Cargo.toml HEAD:Cargo.lock | sha256sum | cut -c1-16) || GATE_OK=false
          BASE_DIGEST=$(docker buildx imagetools inspect "$BASE" --format '{{json .Manifest.Digest}}' | tr -d '"') || GATE_OK=false
          docker pull -q "$BASE" >/dev/null || GATE_OK=false
          PKG_KEY=$(docker run --user root --rm "$BASE" sh -c "apk update -q >/dev/null 2>&1; apk version -l '<' 2>/dev/null | sort" | sha256sum | cut -c1-16) || GATE_OK=false

          if [ "$GATE_OK" != "true" ] || [ -z "$CODE_KEY" ] || [ -z "$BASE_DIGEST" ] || [ -z "$PKG_KEY" ]; then
            echo "::warning::content gate failed for haproxy; building unconditionally"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "key=gate-error-${{ github.sha }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          KEY=$(printf '%s\n' "$CODE_KEY" "$BASE_DIGEST" "$PKG_KEY" | sha256sum | cut -c1-32)
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

          PUBLISHED_KEY=$(docker buildx imagetools inspect "$IMG:$TAG" --format '{{json .Image}}' 2>/dev/null \
            | jq -r '(.config // .["linux/amd64"].config) | .Labels["railway.content-key"] // empty' 2>/dev/null || true)

          if [ "${{ github.event.inputs.force || 'false' }}" = "true" ]; then
            echo "force requested — building"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ "$KEY" = "$PUBLISHED_KEY" ]; then
            echo "unchanged (key $KEY) — skipping build; digest stays put"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed (key $KEY, published ${PUBLISHED_KEY:-<none>}) — building"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push haproxy for amd64
        if: steps.gate.outputs.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./haproxy/Dockerfile
          build-args: |
            HAPROXY_VERSION=${{ env.HAPROXY_VERSION }}
            PKG_REFRESH=${{ steps.gate.outputs.key }}
          labels: |
            railway.content-key=${{ steps.gate.outputs.key }}
          build-contexts: |
            rust-binaries=docker-image://${{ env.IMAGE_PREFIX }}/haproxy-rust-binaries:${{ steps.meta.outputs.short }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/haproxy:${{ env.HAPROXY_VERSION }}${{ env.BETA_SUFFIX }}
            ${{ env.IMAGE_PREFIX }}/haproxy:${{ steps.meta.outputs.major }}${{ env.BETA_SUFFIX }}
            ${{ env.IMAGE_PREFIX }}/haproxy:${{ env.HAPROXY_VERSION }}-${{ steps.meta.outputs.short }}${{ env.BETA_SUFFIX }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/haproxy:${{ env.HAPROXY_VERSION }}
          cache-to: type=inline

      - name: Refresh pin tags on unchanged image
        if: steps.gate.outputs.changed == 'false'
        run: |
          IMG="${{ env.IMAGE_PREFIX }}/haproxy"
          SRC="$IMG:${{ env.HAPROXY_VERSION }}${{ env.BETA_SUFFIX }}"
          docker buildx imagetools create \
            -t "$IMG:${{ steps.meta.outputs.major }}${{ env.BETA_SUFFIX }}" \
            -t "$IMG:${{ env.HAPROXY_VERSION }}-${{ steps.meta.outputs.short }}${{ env.BETA_SUFFIX }}" \
            "$SRC"
