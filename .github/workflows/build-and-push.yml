name: Build and Push Docker Images

on:
  # Run daily at midnight UTC. Daily (not weekly) keeps the window between an
  # upstream minor release and our first per-minor build short: HA conversion
  # pins the source's own minor, so a brand-new upstream minor is convertible
  # only once discover-redis-minors has seen it and this workflow has
  # published its image.
  schedule:
    - cron: '0 0 * * *'
  # Allow manual trigger
  workflow_dispatch:
  # Build on push to main
  push:
    branches:
      - main
    paths:
      - 'redis-sentinel/**'
      - 'haproxy/**'
      - 'common/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-and-push.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  HAPROXY_VERSION: "3.2"
  # The single policy knob for which Redis majors get per-minor builds —
  # mirrors the template's supportedImageMajorVersions. The `X.Y` minors
  # within each major are discovered from Docker Hub on every run, never
  # hardcoded here.
  REDIS_SUPPORTED_MAJORS: "7 8"
  # No suffix - publish to regular tags
  BETA_SUFFIX: ''

jobs:
  # Detect which components changed to avoid unnecessary builds
  changes:
    runs-on: ubuntu-latest
    outputs:
      redis-sentinel: ${{ steps.filter.outputs.redis-sentinel }}
      haproxy: ${{ steps.filter.outputs.haproxy }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            redis-sentinel:
              - 'redis-sentinel/**'
              - 'common/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/build-and-push.yml'
            haproxy:
              - 'haproxy/**'
              - 'common/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/build-and-push.yml'

  # Enumerate every `X.Y` minor Docker Hub publishes a `redis:X.Y-bookworm`
  # tag for (the exact tag the wrapper builds FROM) within the supported
  # majors. The list is discovered per run instead of hardcoded so a new
  # upstream minor starts building the day Docker Hub carries it — the
  # platform's HA conversion pins the adopted service's own `major.minor`
  # minor, so a minor with no published image is a minor whose users cannot
  # convert. Old minors stay in the set for the same reason: building a
  # minor a user already runs is strictly better than stranding their
  # conversion.
  #
  # The job also marks the newest minor of each major so the floating
  # :<major> tags keep riding it, exactly as the hardcoded matrix's
  # `floating_major` entries did.
  discover-redis-minors:
    needs: changes
    if: ${{ needs.changes.outputs['redis-sentinel'] == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      packages: read
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}

    steps:
      - name: Discover Redis minor tags on Docker Hub
        id: discover
        run: |
          page="https://hub.docker.com/v2/repositories/library/redis/tags?page_size=100"
          : > /tmp/hub-tags.txt
          pages=0
          while [ -n "$page" ] && [ "$page" != "null" ]; do
            if [ "$pages" -ge 50 ]; then
              echo "more than 50 pages of Docker Hub tags; refusing to loop forever" >&2
              exit 1
            fi
            # --retry-all-errors: Docker Hub rate-limits shared runner IPs
            # with transient 403/429s, which plain --retry does not retry.
            resp=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 "$page")
            echo "$resp" | jq -r '.results[].name' >> /tmp/hub-tags.txt
            page=$(echo "$resp" | jq -r '.next')
            pages=$((pages + 1))
          done

          # Emit a matrix-include array: every minor gets a plain entry, the
          # newest minor of each major additionally carries floating_major so
          # the :<major> tag minting below keeps working unchanged. Values
          # come from a digits-and-dots regex, so hand-building the JSON is
          # safe.
          : > /tmp/minors.txt
          matrix="["
          sep=""
          for major in $REDIS_SUPPORTED_MAJORS; do
            found=$(grep -E "^${major}\.[0-9]+-bookworm$" /tmp/hub-tags.txt | sed 's/-bookworm$//' | sort -uV)
            if [ -z "$found" ]; then
              # Anti-shrink: an empty result for a supported major means the
              # discovery is broken (API change, filter regression), not that
              # the major vanished upstream — fail loudly rather than
              # silently stop building its minors.
              echo "no X.Y-bookworm minors discovered for supported major ${major}" >&2
              exit 1
            fi
            echo "$found" >> /tmp/minors.txt
            newest=$(echo "$found" | tail -n 1)
            for minor in $found; do
              if [ "$minor" = "$newest" ]; then
                entry="{\"redis_version\":\"${minor}\",\"floating_major\":\"${major}\"}"
              else
                entry="{\"redis_version\":\"${minor}\"}"
              fi
              matrix="${matrix}${sep}${entry}"
              sep=","
            done
          done
          matrix="${matrix}]"

          echo "discovered minors:"
          cat /tmp/minors.txt
          echo "matrix: $matrix"

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      # A published :X.Y tag is a build line users are pinned to. If the
      # discovered set ever fails to cover one (Docker Hub API glitch, filter
      # regression), that minor would silently stop receiving builds — fail
      # the run instead. Best-effort on the listing side only: a ghcr API
      # hiccup warns and proceeds so it cannot block image builds. Published
      # minors outside REDIS_SUPPORTED_MAJORS are exempt, so retiring a major
      # stays a one-knob policy change.
      - name: Refuse to shrink the published minor set (best-effort)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          endpoint="/orgs/${{ github.repository_owner }}/packages/container/redis-ha%2Fredis-sentinel/versions?per_page=100"
          if published=$(gh api --paginate "$endpoint" --jq '.[].metadata.container.tags[]' 2>/dev/null); then
            majors_re=$(echo "$REDIS_SUPPORTED_MAJORS" | tr ' ' '|')
            published_minors=$(echo "$published" | grep -E "^(${majors_re})\.[0-9]+$" | sort -uV || true)
            missing=""
            for tag in $published_minors; do
              grep -qx "$tag" /tmp/minors.txt || missing="$missing $tag"
            done
            if [ -n "$missing" ]; then
              echo "discovered set does not cover already-published minors:$missing" >&2
              exit 1
            fi
            echo "coverage ok: all published minors are in the discovered set"
          else
            echo "warning: could not list published ghcr tags; skipping coverage guard"
          fi

  # Build Rust binary for redis-sentinel (AMD64 - bookworm, native, fast ~2-3min)
  # The binary is version-agnostic — one build covers all Redis major versions.
  build-rust-binaries-redis-sentinel-amd64:
    needs: changes
    if: ${{ needs.changes.outputs['redis-sentinel'] == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build and push rust binaries for redis-sentinel amd64
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./redis-sentinel/Dockerfile
          target: rust-builder-local-output
          platforms: linux/amd64
          push: true
          # SHA-tagged, not :latest — this is a same-run handoff to
          # build-redis-sentinel-amd64, never pulled independently.
          tags: ${{ env.IMAGE_PREFIX }}/redis-sentinel-rust-binaries:${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=redis-sentinel-rust-binaries
          cache-to: type=gha,mode=max,scope=redis-sentinel-rust-binaries

  # Build Rust binary for haproxy (AMD64 - alpine, native, fast ~2-3min)
  build-rust-binaries-haproxy-amd64:
    needs: changes
    if: ${{ needs.changes.outputs.haproxy == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build and push rust binaries for haproxy amd64
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./haproxy/Dockerfile
          target: rust-builder-local-output
          platforms: linux/amd64
          push: true
          # SHA-tagged, not :latest — this is a same-run handoff to
          # build-haproxy-amd64, never pulled independently.
          tags: ${{ env.IMAGE_PREFIX }}/haproxy-rust-binaries:${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=haproxy-rust-binaries
          cache-to: type=gha,mode=max,scope=haproxy-rust-binaries

  # Build redis-sentinel for AMD64 — one continuously rebuilt image per Redis
  # MINOR, not per major. RDB streams are not backward-readable across minors
  # (7.0=RDB10, 7.2=11, 7.4=12), so the platform's HA conversion pins a
  # converted service to its own `major.minor` tag; every one of those tags
  # must therefore be a real build line that keeps receiving upstream patch,
  # base-image and wrapper (Sentinel/health-server) updates for as long as
  # this workflow runs. The frozen-alias scheme this replaces left any
  # cluster pinned to a non-current minor without security updates of any
  # kind — see the deleted mint-minor-alias.yml for the old semantics.
  #
  # The minor list comes from discover-redis-minors, never from a hand-kept
  # matrix: REDIS_SUPPORTED_MAJORS (env, above) is the single policy knob.
  # The floating :<major> tag rides the newest minor of its major (the
  # `floating_major` entries the discover job marks). The mono-side
  # conversion pre-flight refuses (with a clear error, before touching
  # anything) sources whose minor has no published build, so the only cost
  # of a brand-new upstream minor is conversions of it being blocked until
  # the next daily run has discovered, built, and published it.
  build-redis-sentinel-amd64:
    needs: [changes, build-rust-binaries-redis-sentinel-amd64, discover-redis-minors]
    if: ${{ needs.changes.outputs['redis-sentinel'] == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      # Each minor is an independent build line — one broken minor must not
      # cancel the others' builds.
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover-redis-minors.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      # Push only the immutable sha tag here; the resolvable tags (:X.Y and,
      # for the newest minor, :X) are minted below AFTER the bundled-version
      # guard, so a base-image mixup can never reach a tag the platform pins.
      - name: Build and push redis-sentinel for amd64
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./redis-sentinel/Dockerfile
          build-args: REDIS_VERSION=${{ matrix.redis_version }}
          build-contexts: |
            rust-binaries=docker-image://${{ env.IMAGE_PREFIX }}/redis-sentinel-rust-binaries:${{ steps.sha.outputs.short }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/redis-sentinel:${{ matrix.redis_version }}-${{ steps.sha.outputs.short }}${{ env.BETA_SUFFIX }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/redis-sentinel:${{ matrix.redis_version }}${{ env.BETA_SUFFIX }}
          cache-to: type=inline

      # The tag IS the compatibility contract (the conversion pin trusts that
      # :8.2 bundles a Redis 8.2.x), so refuse to publish a build whose base
      # image bundles anything else rather than poison the tag.
      - name: Verify the bundled minor matches the matrix entry, then publish
        run: |
          img="${{ env.IMAGE_PREFIX }}/redis-sentinel:${{ matrix.redis_version }}-${{ steps.sha.outputs.short }}${{ env.BETA_SUFFIX }}"
          version=$(docker run --rm --entrypoint redis-server "$img" --version)
          echo "bundled: $version"
          minor=$(echo "$version" | sed -nE 's/.*v=([0-9]+\.[0-9]+).*/\1/p')
          if [ -z "$minor" ]; then
            echo "could not parse a major.minor out of redis-server --version" >&2
            exit 1
          fi
          if [ "$minor" != "${{ matrix.redis_version }}" ]; then
            echo "bundled minor $minor does not match matrix entry ${{ matrix.redis_version }}" >&2
            exit 1
          fi

          tags="-t ${{ env.IMAGE_PREFIX }}/redis-sentinel:${{ matrix.redis_version }}${{ env.BETA_SUFFIX }}"
          if [ -n "${{ matrix.floating_major }}" ]; then
            tags="$tags -t ${{ env.IMAGE_PREFIX }}/redis-sentinel:${{ matrix.floating_major }}${{ env.BETA_SUFFIX }}"
            tags="$tags -t ${{ env.IMAGE_PREFIX }}/redis-sentinel:${{ matrix.floating_major }}-${{ steps.sha.outputs.short }}${{ env.BETA_SUFFIX }}"
          fi
          docker buildx imagetools create $tags "$img"

  # Build haproxy image for AMD64
  build-haproxy-amd64:
    needs: [changes, build-rust-binaries-haproxy-amd64]
    if: ${{ needs.changes.outputs.haproxy == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short SHA and version parts
        id: meta
        run: |
          echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "major=$(echo ${{ env.HAPROXY_VERSION }} | cut -d. -f1)" >> $GITHUB_OUTPUT

      - name: Build and push haproxy for amd64
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./haproxy/Dockerfile
          build-args: HAPROXY_VERSION=${{ env.HAPROXY_VERSION }}
          build-contexts: |
            rust-binaries=docker-image://${{ env.IMAGE_PREFIX }}/haproxy-rust-binaries:${{ steps.meta.outputs.short }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/haproxy:${{ env.HAPROXY_VERSION }}${{ env.BETA_SUFFIX }}
            ${{ env.IMAGE_PREFIX }}/haproxy:${{ steps.meta.outputs.major }}${{ env.BETA_SUFFIX }}
            ${{ env.IMAGE_PREFIX }}/haproxy:${{ env.HAPROXY_VERSION }}-${{ steps.meta.outputs.short }}${{ env.BETA_SUFFIX }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/haproxy:${{ env.HAPROXY_VERSION }}
          cache-to: type=inline
