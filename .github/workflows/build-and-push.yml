name: Build and Push Docker Images

on:
  # Run weekly on Mondays at midnight UTC
  schedule:
    - cron: '0 0 * * 1'
  # Allow manual trigger
  workflow_dispatch:
  # Build on push to main
  push:
    branches:
      - main
    paths:
      - 'redis-sentinel/**'
      - 'haproxy/**'
      - 'common/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-and-push.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  HAPROXY_VERSION: "3.2"
  # No suffix - publish to regular tags
  BETA_SUFFIX: ''
  # The ONE policy knob in the version story, mirroring the template's
  # haConversionConfig.supportedImageMajorVersions: a new major means
  # validating the wrapper against it, so it is an explicit decision. The
  # MINORS within these majors are mechanical (the wrapper is minor-agnostic
  # — it always ran whatever the floating major bundled) and are discovered
  # from Docker Hub at run time, never hardcoded.
  REDIS_SUPPORTED_MAJORS: '7 8'

jobs:
  # Detect which components changed to avoid unnecessary builds
  changes:
    runs-on: ubuntu-latest
    outputs:
      redis-sentinel: ${{ steps.filter.outputs.redis-sentinel }}
      haproxy: ${{ steps.filter.outputs.haproxy }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            redis-sentinel:
              - 'redis-sentinel/**'
              - 'common/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/build-and-push.yml'
            haproxy:
              - 'haproxy/**'
              - 'common/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/build-and-push.yml'

  # Build Rust binary for redis-sentinel (AMD64 - bookworm, native, fast ~2-3min)
  # The binary is version-agnostic — one build covers all Redis major versions.
  build-rust-binaries-redis-sentinel-amd64:
    needs: changes
    if: ${{ needs.changes.outputs['redis-sentinel'] == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build and push rust binaries for redis-sentinel amd64
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./redis-sentinel/Dockerfile
          target: rust-builder-local-output
          platforms: linux/amd64
          push: true
          # SHA-tagged, not :latest — this is a same-run handoff to
          # build-redis-sentinel-amd64, never pulled independently.
          tags: ${{ env.IMAGE_PREFIX }}/redis-sentinel-rust-binaries:${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=redis-sentinel-rust-binaries
          cache-to: type=gha,mode=max,scope=redis-sentinel-rust-binaries

  # Build Rust binary for haproxy (AMD64 - alpine, native, fast ~2-3min)
  build-rust-binaries-haproxy-amd64:
    needs: changes
    if: ${{ needs.changes.outputs.haproxy == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build and push rust binaries for haproxy amd64
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./haproxy/Dockerfile
          target: rust-builder-local-output
          platforms: linux/amd64
          push: true
          # SHA-tagged, not :latest — this is a same-run handoff to
          # build-haproxy-amd64, never pulled independently.
          tags: ${{ env.IMAGE_PREFIX }}/haproxy-rust-binaries:${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=haproxy-rust-binaries
          cache-to: type=gha,mode=max,scope=haproxy-rust-binaries

  # Enumerates every minor of the supported majors that upstream publishes a
  # `redis:<major.minor>-bookworm` base for, straight from Docker Hub — a new
  # upstream minor joins the build set on the next run with no code change.
  # A hardcoded list here would be the mint-minor-alias failure mode again: a
  # manual inventory someone forgets to extend, where the forgetting is
  # silent and the cost lands on whichever customer converts first.
  #
  # Guards, because a too-small matrix silently freezes build lines:
  # - a supported major discovering zero minors fails the run (API shape
  #   change or Hub outage must be loud, never an empty matrix);
  # - the discovered set must cover every `major.minor` tag this repo has
  #   already published (upstream never deletes version tags, so a shrink
  #   means the discovery broke, not the world changed).
  discover-redis-minors:
    needs: changes
    if: ${{ needs.changes.outputs['redis-sentinel'] == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      packages: read
    outputs:
      matrix: ${{ steps.minors.outputs.matrix }}
    steps:
      - name: Discover maintained Redis minors from Docker Hub
        id: minors
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_VERSIONS_URL: https://api.github.com/orgs/${{ github.repository_owner }}/packages/container/redis-ha%2Fredis-sentinel/versions?per_page=100
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, sys, urllib.request

          majors = os.environ["REDIS_SUPPORTED_MAJORS"].split()

          url = "https://hub.docker.com/v2/repositories/library/redis/tags?page_size=100&name=bookworm"
          minors: set[tuple[int, int]] = set()
          while url:
              with urllib.request.urlopen(url, timeout=30) as r:
                  page = json.load(r)
              for entry in page.get("results", []):
                  m = re.fullmatch(r"(\d+)\.(\d+)-bookworm", entry["name"])
                  if m and m.group(1) in majors:
                      minors.add((int(m.group(1)), int(m.group(2))))
              url = page.get("next")

          for major in majors:
              if not any(str(mj) == major for mj, _ in minors):
                  raise SystemExit(
                      f"discovered no {major}.x-bookworm tags on Docker Hub — "
                      "refusing to build an empty line for a supported major"
                  )

          # Never shrink below what this repo already publishes: a pinned
          # cluster's build line going missing from the matrix is exactly the
          # silent freeze this discovery exists to prevent. Best-effort read —
          # an unreachable packages API proves nothing and must not block the
          # rebuild of everything Docker Hub did enumerate.
          try:
              req = urllib.request.Request(
                  os.environ["PACKAGE_VERSIONS_URL"],
                  headers={
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept": "application/vnd.github.v3+json",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  versions = json.load(r)
              published = {
                  (int(m.group(1)), int(m.group(2)))
                  for v in versions
                  for tag in (v.get("metadata", {}).get("container", {}).get("tags", []))
                  if (m := re.fullmatch(r"(\d+)\.(\d+)", tag)) and m.group(1) in majors
              }
              missing = published - minors
              if missing:
                  raise SystemExit(
                      f"already-published minors missing from discovery: {sorted(missing)} — "
                      "the discovery is broken; refusing to freeze their build lines"
                  )
          except SystemExit:
              raise
          except Exception as err:  # noqa: BLE001 — unknown is not a violation
              print(f"::warning::could not cross-check published tags: {err}")

          newest = {mj: max(mn for m2, mn in minors if m2 == mj) for mj, _ in minors}
          include = [
              {"redis_version": f"{mj}.{mn}"}
              | ({"floating_major": str(mj)} if newest[mj] == mn else {})
              for mj, mn in sorted(minors)
          ]
          # stdout is $GITHUB_OUTPUT — only the key=value line may go there.
          print(f"discovered: {json.dumps(include)}", file=sys.stderr)
          print("matrix=" + json.dumps({"include": include}))
          PY

  # Build redis-sentinel for AMD64 — one continuously rebuilt image per Redis
  # MINOR, not per major. RDB streams are not backward-readable across minors
  # (7.0=RDB10, 7.2=11, 7.4=12), so the platform's HA conversion pins a
  # converted service to its own `major.minor` tag; every one of those tags
  # must therefore be a real build line that keeps receiving upstream patch,
  # base-image and wrapper (Sentinel/health-server) updates for as long as
  # this workflow runs. The frozen-alias scheme this replaces left any
  # cluster pinned to a non-current minor without security updates of any
  # kind — see the deleted mint-minor-alias.yml for the old semantics.
  #
  # The matrix comes from discover-redis-minors above; the floating :<major>
  # tag rides the newest discovered minor of its major. A brand-new upstream
  # minor is buildable at latest one weekly run after Docker Hub publishes it
  # (or immediately via workflow_dispatch) — until then the mono-side
  # conversion pre-flight refuses sources on it with a clear error, before
  # touching anything.
  build-redis-sentinel-amd64:
    needs: [changes, build-rust-binaries-redis-sentinel-amd64, discover-redis-minors]
    if: ${{ needs.changes.outputs['redis-sentinel'] == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix: ${{ fromJson(needs.discover-redis-minors.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      # Push only the immutable sha tag here; the resolvable tags (:X.Y and,
      # for the newest minor, :X) are minted below AFTER the bundled-version
      # guard, so a base-image mixup can never reach a tag the platform pins.
      - name: Build and push redis-sentinel for amd64
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./redis-sentinel/Dockerfile
          build-args: REDIS_VERSION=${{ matrix.redis_version }}
          build-contexts: |
            rust-binaries=docker-image://${{ env.IMAGE_PREFIX }}/redis-sentinel-rust-binaries:${{ steps.sha.outputs.short }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/redis-sentinel:${{ matrix.redis_version }}-${{ steps.sha.outputs.short }}${{ env.BETA_SUFFIX }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/redis-sentinel:${{ matrix.redis_version }}${{ env.BETA_SUFFIX }}
          cache-to: type=inline

      # The tag IS the compatibility contract (the conversion pin trusts that
      # :8.2 bundles a Redis 8.2.x), so refuse to publish a build whose base
      # image bundles anything else rather than poison the tag.
      - name: Verify the bundled minor matches the matrix entry, then publish
        run: |
          img="${{ env.IMAGE_PREFIX }}/redis-sentinel:${{ matrix.redis_version }}-${{ steps.sha.outputs.short }}${{ env.BETA_SUFFIX }}"
          version=$(docker run --rm --entrypoint redis-server "$img" --version)
          echo "bundled: $version"
          minor=$(echo "$version" | sed -nE 's/.*v=([0-9]+\.[0-9]+).*/\1/p')
          if [ -z "$minor" ]; then
            echo "could not parse a major.minor out of redis-server --version" >&2
            exit 1
          fi
          if [ "$minor" != "${{ matrix.redis_version }}" ]; then
            echo "bundled minor $minor does not match matrix entry ${{ matrix.redis_version }}" >&2
            exit 1
          fi

          tags="-t ${{ env.IMAGE_PREFIX }}/redis-sentinel:${{ matrix.redis_version }}${{ env.BETA_SUFFIX }}"
          if [ -n "${{ matrix.floating_major }}" ]; then
            tags="$tags -t ${{ env.IMAGE_PREFIX }}/redis-sentinel:${{ matrix.floating_major }}${{ env.BETA_SUFFIX }}"
            tags="$tags -t ${{ env.IMAGE_PREFIX }}/redis-sentinel:${{ matrix.floating_major }}-${{ steps.sha.outputs.short }}${{ env.BETA_SUFFIX }}"
          fi
          docker buildx imagetools create $tags "$img"

  # Build haproxy image for AMD64
  build-haproxy-amd64:
    needs: [changes, build-rust-binaries-haproxy-amd64]
    if: ${{ needs.changes.outputs.haproxy == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short SHA and version parts
        id: meta
        run: |
          echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "major=$(echo ${{ env.HAPROXY_VERSION }} | cut -d. -f1)" >> $GITHUB_OUTPUT

      - name: Build and push haproxy for amd64
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./haproxy/Dockerfile
          build-args: HAPROXY_VERSION=${{ env.HAPROXY_VERSION }}
          build-contexts: |
            rust-binaries=docker-image://${{ env.IMAGE_PREFIX }}/haproxy-rust-binaries:${{ steps.meta.outputs.short }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/haproxy:${{ env.HAPROXY_VERSION }}${{ env.BETA_SUFFIX }}
            ${{ env.IMAGE_PREFIX }}/haproxy:${{ steps.meta.outputs.major }}${{ env.BETA_SUFFIX }}
            ${{ env.IMAGE_PREFIX }}/haproxy:${{ env.HAPROXY_VERSION }}-${{ steps.meta.outputs.short }}${{ env.BETA_SUFFIX }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/haproxy:${{ env.HAPROXY_VERSION }}
          cache-to: type=inline
