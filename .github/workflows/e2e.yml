name: E2E

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: redis-sentinel/Dockerfile
          build-args: REDIS_VERSION=8
          platforms: linux/amd64
          tags: redis-sentinel-e2e:local
          load: true
          cache-from: type=gha,scope=e2e-node
          cache-to: type=gha,mode=max,scope=e2e-node

      # The through-the-edge scenarios run the real HAProxy image. Pre-build
      # it here, cache-warmed, so the harness's lazy in-scenario build (meant
      # for local subset runs) finds the tag and skips a cold cargo build on
      # the runner.
      - name: Build edge image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: haproxy/Dockerfile
          platforms: linux/amd64
          tags: haproxy-e2e:local
          load: true
          cache-from: type=gha,scope=e2e-edge
          cache-to: type=gha,mode=max,scope=e2e-edge

      - name: Run e2e harness
        # GitHub's default `run:` shell has no pipefail, so without it the
        # pipe to tee swallows the harness's failure-count exit code and the
        # job reports success no matter how many scenarios failed.
        run: set -o pipefail; ./test/e2e.sh 2>&1 | tee e2e.log

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-log
          path: e2e.log
